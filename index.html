<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蝶が運ぶ、はじまりの旋律</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260922-preload">
</head>
<body>
  <div class="asset-loader" id="asset-loader" role="status" aria-live="polite" aria-label="ゲーム素材の読み込み状況">
    <div class="asset-loader__card">
      <p class="asset-loader__eyebrow">Blessing Manor</p>
      <h1 class="asset-loader__title">祝福の館</h1>
      <p class="asset-loader__text" id="asset-loader-text">読み込み中…</p>
      <p class="asset-loader__percent" id="asset-loader-percent">0%</p>
      <div class="asset-loader__bar" aria-hidden="true">
        <span id="asset-loader-bar"></span>
      </div>
    </div>
  </div>

  <button class="audio-start" type="button" id="audio-start">音楽を再生</button>
  <button class="audio-toggle" type="button" id="audio-toggle" aria-pressed="false" aria-label="音のオンオフ">音 OFF</button>

  <main class="app-shell">
    <div class="book-status" aria-live="polite">
      <span id="page-count"></span>
      <span class="musicbox-gauge" id="musicbox-gauge" aria-label="オルゴールの完成度"></span>
      <span id="restore-count"></span>
    </div>

    <section id="book" class="book" aria-live="polite"></section>
  </main>

  <script src="firebaseConfig.js?v=20260710-rtdb"></script>
  <script src="script.js?v=20260922-preload"></script>
</body>
</html>
